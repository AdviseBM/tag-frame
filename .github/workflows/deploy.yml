# Publishes the tag frame to GitHub Pages under tags.advise.is on every push
# to master. The site holds /tag-frame/index.html and /tag-frame/tag-frame.js
# and nothing else; / is a 404 on purpose.
#
# One-time setup (repository settings → Pages): source "GitHub Actions",
# custom domain tags.advise.is (DNS: CNAME tags → advisebm.github.io),
# "Enforce HTTPS" on once the certificate is issued.
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}tag-frame/index.html
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/tag-frame
          cp tag-frame/index.html tag-frame/tag-frame.js _site/tag-frame/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
